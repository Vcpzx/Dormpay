<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login/login.css">
    <title>Login - Dormpay</title>
</head>
<body>
    <div class="login-card">
        <div class="input-page">
            <div class="login-page-input">
                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p>Log in to your <span>Dormpay</span> account</p>
                </div>

                <form class="login-form">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="student@university.edu" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <div class="form-actions">
                        <label class="remember-me">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-pass">Forgot password?</a>
                    </div>

                    <button type="submit" class="login-btn" onclick="window.location.href='dashboard.html'">Log In</button>
                </form>

                <div class="login-footer">
                    <p>Don't have an account? <a href="#">Sign up</a></p>
                    <a href="landpage.html" class="back-home">← Back to Home</a>
                </div>
            </div>
            
        </div>

        <div class="greet">
            <div>
                <div class="assistant">
                        <img class="robot" src="../img/design/Gemini_Generated_Image_e7sty6e7sty6e7st-removebg-preview.png" alt="">
                    </div>
                <div>
                        <img class="line" src="../img/design/—Pngtree—beautiful abstract line background curved_4403098.png" alt="">
                        <div class="greet-text">
                            <img class="logo" src="../img/logo/whitelogo.png
                            " alt="">
                            <p class="hello">Hello</p>
                            <p class="name">Vernard! </p>
                            <p class="desc">Securely manage your Dorm payments, utility splits, and shared dorm expenses.</p>
                        </div>
                </div>
            
                
            </div>
        </div>
            
    </div>
</body>
</html>
